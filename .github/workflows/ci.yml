name: CI

# Docs-only changes (README, GIF, license) don't need a run.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "readme_assets/**"
      - "LICENSE"
      - ".gitignore"
      - ".vscode/**"
  push:
    paths-ignore:
      - "**.md"
      - "readme_assets/**"
      - "LICENSE"
      - ".gitignore"
      - ".vscode/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build exactly what gets deployed, snapshot included. The workflow's
      # own token is enough for public repository data (no heatmap).
      - run: npm run snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run build && mkdir -p _site && cp -r dist _site/dev-timeline
      - run: npx --yes @lhci/cli@0.15.1 autorun
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
